name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 \
            -f https://data.pyg.org/whl/torch-2.1.1+cpu.html
          python -m pip install -r requirements.txt

      - name: Check launcher syntax
        run: find slurm -type f \( -name '*.slurm' -o -name '*.sh' \) -print0 | xargs -0 -n1 bash -n

      - name: Run tests
        run: pytest -q
